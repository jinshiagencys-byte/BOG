name: WebMCP QA — Playwright

# Exécuteur QA instrumenté, distinct du workflow fastbrowse.
#
# Playwright ouvre Chrome, la page expose ses outils WebMCP, le runner les
# exécute et vérifie le résultat avec ses propres assertions.
# Un plan LLM facultatif décrit ce qu'il faut vérifier (schéma), mais il ne
# fournit ni sélecteur ni script : le scénario exécuté reste déterministe.
#
# Deux familles de cas, exécutées par le même runner :
#   • webmcp    — la page expose des outils, le runner les appelle ;
#   • playwright — le cas décrit des actions déterministes (sites non
#     instrumentés, comme odjafrik.com).
#
# Trois modes :
#   • run réel  : manifest_url + run_token + report_url (déclenché par start-run) ;
#   • manifeste local : manifest_file + cases_file, sans Supabase (sites réels) ;
#   • démonstration : sans manifest_url ni manifest_file, le workflow sert
#     .github/qa/fixtures/webmcp-demo.html et exécute
#     .github/qa/webmcp-demo-manifest.json. C'est aussi le mode déclenché par
#     un push sur les fichiers de démonstration.

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: "ID du run Supabase (test_runs.id)"
        required: false
        type: string
      manifest_url:
        description: "URL de l'Edge Function run-manifest (vide = mode démonstration)"
        required: false
        type: string
      run_token:
        description: "Jeton éphémère du run (x-run-token)"
        required: false
        type: string
      report_url:
        description: "URL de l'Edge Function report-run"
        required: false
        type: string
      evidence_upload_url:
        description: "URL de l'Edge Function upload-evidence (vidéos, facultative)"
        required: false
        type: string
      profile_save_url:
        description: "URL de l'Edge Function save-site-profile (profil d'exploration, facultative)"
        required: false
        type: string
      plan_url:
        description: "URL de l'Edge Function qa-plan (relais LLM, facultative)"
        required: false
        type: string
      target_url:
        description: "URL cible par défaut (facultative)"
        required: false
        type: string
      manifest_file:
        description: "Manifeste du dépôt à exécuter sans Supabase (ex. .github/qa/playwright-odjafrik-manifest.json)"
        required: false
        type: string
      cases_file:
        description: "Catalogue des objectifs (WebMCP ou scénarios Playwright)"
        required: false
        default: ".github/qa/fastbrowse-cases.json"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/webmcp-qa.yml"
      - ".github/qa/webmcp-runner.mjs"
      - ".github/qa/webmcp-executor.mjs"
      - ".github/qa/case-planner.mjs"
      - ".github/qa/perch-planner.mjs"
      - ".github/qa/webmcp-demo-cases.json"
      - ".github/qa/webmcp-demo-manifest.json"
      - ".github/qa/fixtures/**"

permissions:
  contents: read

concurrency:
  group: webmcp-qa-${{ inputs.qa_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  webmcp-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget ca-certificates
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -O /tmp/google-chrome.deb
            sudo apt-get install -y /tmp/google-chrome.deb
          fi
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            google-chrome-stable --version
          fi

      - name: Installer Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-node"
          npm install --prefix "$RUNNER_TEMP/qa-node" --no-audit --no-fund playwright-core@1.64.1
          NODE_PATH="$RUNNER_TEMP/qa-node/node_modules" \
            node -e "console.log('✓ playwright-core', require('playwright-core/package.json').version)"

      - name: Installer ffmpeg Playwright
        shell: bash
        run: |
          set -euo pipefail
          # Nécessaire pour recordVideo. Ne télécharge que ffmpeg.
          node "$RUNNER_TEMP/qa-node/node_modules/playwright-core/cli.js" install ffmpeg

      - name: Installer le CLI Perch (plan LLM)
        id: perch
        env:
          PERCH_CLI_SESSION: ${{ secrets.PERCH_CLI_SESSION }}
        shell: bash
        run: |
          set -euo pipefail
          # Sans session, aucun fournisseur Perch : le plan retombe sur le
          # relais `qa-plan`, puis sur un appel direct.
          if [ -z "${PERCH_CLI_SESSION:-}" ]; then
            echo "i Aucune session Perch : plan via le relais"
            exit 0
          fi
          npm install -g perchai-cli --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/perch-auth"
          printf '%s' "$PERCH_CLI_SESSION" > "$RUNNER_TEMP/perch-auth/cli-auth-session.json"
          chmod 600 "$RUNNER_TEMP/perch-auth/cli-auth-session.json"
          # Une session périmée ne doit pas casser le run : avertissement et
          # repli sur le relais.
          if PERCH_CLI_AUTH_DIR="$RUNNER_TEMP/perch-auth" perch status; then
            echo "auth_dir=$RUNNER_TEMP/perch-auth" >> "$GITHUB_OUTPUT"
            echo "✓ Session Perch chargée depuis le secret"
          else
            echo "::warning::Session Perch invalide : plan via le relais"
          fi

      - name: Récupérer le manifeste du run
        if: inputs.manifest_url != ''
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MANIFEST_URL:?manifest_url requis}"
          : "${RUN_TOKEN:?run_token requis}"
          curl -fsS --retry 5 --retry-delay 5 \
            -H "x-run-token: $RUN_TOKEN" "$MANIFEST_URL" -o run_manifest.json
          jq -e '.cases | type == "array" and length > 0' run_manifest.json >/dev/null

      - name: Préparer la session Playwright
        id: session
        env:
          STORAGE_STATE: ${{ secrets.WEBMCP_STORAGE_STATE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${STORAGE_STATE:-}" ]; then
            printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/webmcp-storage.json"
            chmod 600 "$RUNNER_TEMP/webmcp-storage.json"
            echo "storage=$RUNNER_TEMP/webmcp-storage.json" >> "$GITHUB_OUTPUT"
            echo "✓ Session Playwright chargée depuis le secret"
          else
            echo "ℹ Aucune session fournie : les cas doivent être publics"
          fi

      - name: Servir la page de démonstration
        if: inputs.manifest_url == '' && inputs.manifest_file == ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 \
            --directory .github/qa/fixtures >/tmp/webmcp-demo-server.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/webmcp-demo.html >/dev/null; then
              echo "✓ Démonstration servie sur http://127.0.0.1:4173"
              exit 0
            fi
            sleep 0.25
          done
          echo "::error::Le serveur de démonstration n'a pas démarré"
          cat /tmp/webmcp-demo-server.log
          exit 1

      - name: Exécuter les cas WebMCP
        id: qa
        env:
          NODE_PATH: ${{ runner.temp }}/qa-node/node_modules
          QA_ROOT: ${{ github.workspace }}
          RUN_MANIFEST: ${{ inputs.manifest_url != '' && 'run_manifest.json' || inputs.manifest_file }}
          WEBMCP_DEMO_MANIFEST: ${{ github.workspace }}/.github/qa/webmcp-demo-manifest.json
          WEBMCP_CASES: ${{ (inputs.manifest_url != '' || inputs.manifest_file != '') && format('{0}/{1}', github.workspace, inputs.cases_file) || format('{0}/.github/qa/webmcp-demo-cases.json', github.workspace) }}
          WEBMCP_PROBE_DIR: ${{ runner.temp }}/qa-node
          WEBMCP_STORAGE_STATE: ${{ steps.session.outputs.storage }}
          TARGET_URL: ${{ inputs.target_url || 'http://127.0.0.1:4173/webmcp-demo.html' }}
          QA_OUTPUT: ${{ github.workspace }}/qa_result.json
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          REPORT_URL: ${{ inputs.report_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
          EVIDENCE_UPLOAD_URL: ${{ inputs.evidence_upload_url }}
          PROFILE_SAVE_URL: ${{ inputs.profile_save_url }}
          PLAN_URL: ${{ inputs.plan_url }}
          WEBMCP_PLAN: auto
          # Premier fournisseur : TokenHarbor, endpoint compatible OpenAI.
          # Clé côté secret GitHub ; le relais `qa-plan` reste le repli.
          WEBMCP_PLAN_ENDPOINT: https://tokenharbor.ai/v1
          WEBMCP_PLAN_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          WEBMCP_PLAN_MODEL: deepseek-v4.1-flash:free
          WEBMCP_PLAN_LABEL: tokenharbor
          # Plan Perch : activé seulement si le CLI et la session sont là.
          PERCH_CLI_AUTH_DIR: ${{ steps.perch.outputs.auth_dir }}
          PERCH_TIMEOUT_MS: "240000"
          WEBMCP_PERCH: auto
          # Repli : OpenCode. Puis OpenRouter (modèle gratuit) si la clé est
          # configurée. Sans clé, le scénario déterministe suffit.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: https://opencode.ai/inference/openai/v1
          OPENCODE_MODEL: deepseek-v4.1-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          WEBMCP_DELAY_MS: "0"
          WEBMCP_VIDEO_DIR: ${{ github.workspace }}/qa-videos
          WEBMCP_VIDEO_TAIL_MS: "700"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          node .github/qa/webmcp-runner.mjs
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # 0 = cas exécutés, 1 = rapport refusé, 2 = configuration invalide.
          # Un échec de cas ne fait pas échouer le job : le verdict est dans
          # qa_result.json. Une erreur de configuration, si.
          if [ "$CODE" -eq 1 ]; then
            echo "::warning::Le rapport QA a été refusé (code 1)"
          elif [ "$CODE" -ne 0 ]; then
            echo "::error::Le runner WebMCP s'est arrêté avec le code $CODE"
            exit "$CODE"
          fi

      - name: Archiver les preuves QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-qa-${{ inputs.qa_run_id || github.run_id }}
          path: |
            qa_result.json
            run_manifest.json
            qa-videos/
          if-no-files-found: warn
          retention-days: 30
