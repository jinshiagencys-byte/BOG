name: Antigravity QA — TestDino-like run

# Exécution d'un run sélectionné depuis l'application.
# L'agent est Antigravity CLI (`agy`). Son sous-agent navigateur natif `browser`
# utilise son MCP chrome-devtools interne en `--autoConnect` vers un Chrome lancé
# avec CDP par ce workflow.
# Antigravity ne parle qu'à un endpoint Gemini-compatible ; un proxy local traduit
# Gemini <-> OpenAI Chat Completions pour utiliser les modèles OpenCode Zen
# (Big Pickle par défaut, DeepSeek V4.1 Flash Free, Beam Free). Playwright n'est
# plus utilisé.

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: "ID du run Supabase (test_runs.id)"
        required: true
        type: string
      manifest_url:
        description: "URL de l'Edge Function run-manifest"
        required: true
        type: string
      run_token:
        description: "Jeton éphémère du run (x-run-token)"
        required: true
        type: string
      report_url:
        description: "URL de l'Edge Function report-run"
        required: true
        type: string
      model:
        description: "Modèle OpenCode (big-pickle, deepseek-v4.1-flash-free ou beam-free)"
        required: false
        default: "big-pickle"
        type: string
      target_url:
        description: "URL cible (facultative, sinon lue dans le manifeste)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  antigravity-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer Chrome pour le sous-agent navigateur Antigravity
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -O /tmp/google-chrome.deb
            sudo apt-get install -y /tmp/google-chrome.deb
          fi
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            google-chrome-stable --version
          fi

      - name: Lancer Chrome avec CDP pour le sous-agent navigateur
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable)
          # Chrome >= 136 refuse le debug distant sur son profil par défaut.
          # On utilise donc un profil dédié, puis on publie son DevToolsActivePort
          # dans le chemin par défaut lu par `chrome-devtools-mcp --autoConnect`.
          export CHROME_PROFILE="${RUNNER_TEMP:-/tmp}/chrome-qa-profile"
          export CHROME_DISCOVERY_DIR="$HOME/.config/google-chrome"
          rm -rf "$CHROME_PROFILE" "$CHROME_DISCOVERY_DIR"
          mkdir -p "$CHROME_PROFILE" "$CHROME_DISCOVERY_DIR"
          rm -f chrome.log chrome.pid
          nohup "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=0 \
            --remote-allow-origins='*' \
            --user-data-dir="$CHROME_PROFILE" \
            about:blank > chrome.log 2>&1 &
          echo $! > chrome.pid
          READY=0
          for _ in $(seq 1 60); do
            if [ -s "$CHROME_PROFILE/DevToolsActivePort" ]; then
              PORT=$(head -n1 "$CHROME_PROFILE/DevToolsActivePort")
              if curl -fsS "http://127.0.0.1:$PORT/json/version" >/tmp/chrome_version.json 2>/dev/null; then
                cp "$CHROME_PROFILE/DevToolsActivePort" "$CHROME_DISCOVERY_DIR/DevToolsActivePort"
                cat /tmp/chrome_version.json; echo
                READY=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            tail -50 chrome.log || true
            echo "::error::Chrome CDP n'a pas démarré"
            exit 1
          fi
          echo "✓ Chrome CDP prêt sur le port $(head -n1 "$CHROME_PROFILE/DevToolsActivePort")"

      - name: Installer Antigravity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          agy --version

      - name: Configurer Antigravity (Gemini-compatible, navigateur natif)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cat > "$HOME/.gemini/antigravity-cli/settings.json" <<'EOF'
          {
            "modelProvider": "gemini",
            "toolPermission": "always-proceed",
            "enableTerminalSandbox": true,
            "permissions": {
              "deny": [
                "command()",
                "unsandboxed()",
                "read_file(/home/runner/.ssh)",
                "read_file(/home/runner/.config)",
                "read_file(/home/runner/.local)",
                "read_file(/proc)",
                "read_file(/proc/)",
                "write_file(/home/runner/.ssh)",
                "write_file(/home/runner/.config)",
                "write_file(/home/runner/.local)"
              ]
            }
          }
          EOF
          cat "$HOME/.gemini/antigravity-cli/settings.json"

      - name: Récupérer le manifeste du run
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MANIFEST_URL:?manifest_url requis}"
          : "${RUN_TOKEN:?run_token requis}"
          curl -fsS --retry 3 -H "x-run-token: $RUN_TOKEN" "$MANIFEST_URL" -o run_manifest.json
          jq -e '.cases | type == "array" and length > 0' run_manifest.json >/dev/null

      - name: Construire le prompt depuis le manifeste
        id: prompt
        env:
          TARGET_URL_INPUT: ${{ inputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL=$(jq -r '.project.url // empty' run_manifest.json)
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="${TARGET_URL_INPUT:-}"
          fi
          if [ -z "$TARGET_URL" ]; then
            echo "::error::URL cible absente du manifeste et des inputs"
            exit 1
          fi

          jq -r '
            .cases[] |
            "\n\(.code) [\(
               if ((.tags // []) | index("@security")) then "security"
               elif ((.tags // []) | index("@a11y")) then "accessibility"
               elif ((.tags // []) | index("@seo")) then "seo"
               else "functional" end
            )] \(.title)\n" +
            ([.steps[] | "  \(.n). \(.action) | \(.expected)"] | join("\n"))
          ' run_manifest.json > plan.txt

          export TARGET_URL
          python3 - <<'PY'
          import os
          from pathlib import Path
          tpl = Path('.github/qa/prompt.md').read_text(encoding='utf-8')
          plan = Path('plan.txt').read_text(encoding='utf-8').strip()
          prompt = tpl.replace('{{TARGET_URL}}', os.environ['TARGET_URL']).replace('{{PLAN}}', plan)
          Path('qa_prompt.txt').write_text(prompt, encoding='utf-8')
          PY

          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "Prompt QA : $(wc -c < qa_prompt.txt) caractères, $(jq '.cases | length' run_manifest.json) cas"

      - name: Dossiers de preuves
        run: |
          mkdir -p trajectories videos screenshots

      - name: Normaliser le modèle OpenCode
        id: model
        env:
          REQUESTED_MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(printf '%s' "${REQUESTED_MODEL:-}" | tr '[:upper:]' '[:lower:]' | xargs)
          case "$MODEL" in
            deepseek|deepseek-v4.1-flash-free|opencode/deepseek|opencode/deepseek-v4.1-flash-free)
              MODEL="deepseek-v4.1-flash-free" ;;
            big-pickle|big\ pickle|pickle|opencode/big-pickle|opencode/big\ pickle)
              MODEL="big-pickle" ;;
            beam|beam-free|opencode/beam|opencode/beam-free)
              MODEL="beam-free" ;;
            *)
              echo "::warning::Modèle '$REQUESTED_MODEL' inconnu, repli sur big-pickle"
              MODEL="big-pickle" ;;
          esac
          echo "name=$MODEL" >> "$GITHUB_OUTPUT"
          echo "🧠 Modèle OpenCode : $MODEL"

      - name: Démarrer le proxy Gemini -> OpenCode
        env:
          OPENCODE_MODEL: ${{ steps.model.outputs.name }}
          OPENCODE_TITLE_MODEL: big-pickle
          OPENCODE_SAFETY_MODEL: big-pickle
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f proxy.log proxy.pid
          nohup node .github/qa/opencode-gemini-proxy.mjs > proxy.log 2>&1 &
          echo $! > proxy.pid
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/proxy_health.json 2>/dev/null; then
              cat /tmp/proxy_health.json; echo
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat proxy.log || true
            echo "::error::Le proxy OpenCode n'a pas démarré"
            exit 1
          fi

          # Le free tier OpenCode exige un flux SSE, des tools non vides et
          # l'identité du client officiel. Le proxy applique ce contrat ; on
          # vérifie ici qu'un premier chunk arrive avant de lancer l'agent.
          HTTP=$(curl -sS --max-time 75 -o /tmp/model_preflight.json -w '%{http_code}' \
            http://127.0.0.1:8787/preflight || true)
          cat /tmp/model_preflight.json 2>/dev/null || true; echo
          if [ "${HTTP:-}" != "200" ] || ! jq -e '.ok == true' /tmp/model_preflight.json >/dev/null 2>&1; then
            echo "::error::Preflight OpenCode HTTP ${HTTP:-aucun} pour $OPENCODE_MODEL"
            tail -50 proxy.log || true
            exit 1
          fi
          echo "✓ Modèle OpenCode disponible : $OPENCODE_MODEL"

      - name: Exécuter l'agent QA (Antigravity natif + OpenCode)
        id: qa_agent
        env:
          TARGET_URL: ${{ steps.prompt.outputs.target_url }}
          AI_MODEL: ${{ steps.model.outputs.name }}
          # Antigravity ne reçoit jamais de credential OpenCode : le proxy local
          # gère l'authentification. Cette clé factice satisfait son SDK Gemini.
          GEMINI_API_KEY: local-proxy-key
          GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:8787
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          # `chrome-devtools-mcp --autoConnect` lit le DevToolsActivePort de ce
          # répertoire ; on le fixe explicitement pour rester aligné avec Chrome.
          export CHROME_CONFIG_HOME="$HOME/.config"
          rm -f qa_result.json qa_agent.log qa_agent_agy.log
          echo "model=$AI_MODEL" >> "$GITHUB_OUTPUT"

          ANTIGRAVITY_MODEL="gemini-3.8-flash-medium"
          echo "🧠 Modèle OpenCode : $AI_MODEL (proxy Gemini local)"
          echo "🧩 Slug Antigravity : $ANTIGRAVITY_MODEL"

          QA_PROMPT=$(cat qa_prompt.txt)
          printf '%s' "$QA_PROMPT" > trajectories/qa_prompt.txt
          echo "🎯 Cible : $TARGET_URL"
          echo "🌐 Sous-agent : browser (Chrome DevTools natif Antigravity)"

          # Pas de --dangerously-skip-permissions : il contourne aussi les règles
          # deny et autoriserait run_command. `toolPermission: always-proceed`
          # suffit pour write_file et le sous-agent browser, tout en gardant
          # l'interdiction du shell.
          timeout 112m agy -p "$QA_PROMPT" \
            --model "$ANTIGRAVITY_MODEL" \
            --mode auto \
            --print-timeout 105m \
            --log-file "$PWD/qa_agent_agy.log" \
            2>&1 | tee qa_agent.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::agy s'est terminé avec le code $EXIT_CODE"
          fi

      - name: Arrêter le proxy OpenCode
        if: always()
        shell: bash
        run: |
          if [ -f proxy.pid ]; then
            PID=$(cat proxy.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi

      - name: Arrêter Chrome CDP
        if: always()
        shell: bash
        run: |
          if [ -f chrome.pid ]; then
            PID=$(cat chrome.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi
          rm -f "$HOME/.config/google-chrome/DevToolsActivePort" 2>/dev/null || true

      - name: Valider et normaliser le rapport structuré
        id: report
        if: always()
        shell: bash
        run: |
          set +e

          [ -s qa_result.json ] || python3 - <<'PY'
          import json
          txt = open("qa_agent.log", encoding="utf-8", errors="ignore").read()
          dec = json.JSONDecoder()
          best = None
          for i, ch in enumerate(txt):
              if ch == "{":
                  try:
                      obj, _ = dec.raw_decode(txt[i:])
                  except ValueError:
                      continue
                  if isinstance(obj, dict) and "test_cases" in obj:
                      best = obj
          if best:
              json.dump(best, open("qa_result.json", "w"), ensure_ascii=False)
          PY

          if [ -s qa_result.json ]; then
            jq '
              .side_effects //= []
              | .test_cases |= map(
                  .discovered //= false
                | .severity //= null
                | .steps = ((.steps // []) | map(
                    .n |= (if type == "string" then (tonumber? // .) else . end)
                  | .precondition //= ""
                  | .evidence //= {}
                  | .evidence.url //= ""
                  | .evidence.console //= ""
                  | .evidence.network //= ""
                  | .evidence.screenshot //= ""
                  | .evidence.http_status |= (if type == "string" then (tonumber? // null) else . end)
                  | .actual |= (if . == null or . == "" then "non renseigné" else . end)
                  ))
                )
            ' qa_result.json > /tmp/qa_fixed.json \
              && mv /tmp/qa_fixed.json qa_result.json \
              || echo "::warning::Normalisation du JSON impossible (JSON illisible ?)"
          fi

          if jq -e '
            (.test_cases | type == "array" and length > 0)
            and (.side_effects | type == "array")
            and ([.test_cases[].id] | length == (unique | length))
            and all(.test_cases[];
              (.id | type == "string" and length > 0)
              and (.title | type == "string" and length > 0)
              and (.category | . == "functional" or . == "security" or . == "accessibility" or . == "seo")
              and (.discovered | type == "boolean")
              and (.severity == null or .severity == "P0" or .severity == "P1" or .severity == "P2")
              and (.steps | type == "array" and length > 0)
              and ([.steps[].n] | length == (unique | length))
              and all(.steps[];
                (.n | type == "number")
                and (.action | type == "string" and length > 0)
                and (.precondition | type == "string")
                and (.expected | type == "string" and length > 0)
                and (.actual | type == "string" and length > 0)
                and (.status | . == "passed" or . == "failed" or . == "blocked" or . == "skipped")
                and (.evidence | type == "object")
                and (.evidence.url | type == "string")
                and (.evidence.http_status == null or (.evidence.http_status | type == "number"))
                and (.evidence.console | type == "string")
                and (.evidence.network | type == "string")
                and (.evidence.screenshot | type == "string")
                and (if .status == "failed"
                     then ([.evidence.http_status, .evidence.console, .evidence.network, .evidence.screenshot]
                           | any(.[]; . != null and . != ""))
                     else true end)
              )
            )
          ' qa_result.json >/dev/null 2>&1; then
            cp qa_result.json trajectories/qa_result.raw.json
            jq '
              .test_cases |= map(
                .steps = (.steps // [])
                | .status = (
                    if (.steps | length) == 0 then "blocked"
                    elif any(.steps[]; .status == "failed") then "failed"
                    elif any(.steps[]; .status == "blocked") then "blocked"
                    elif all(.steps[]; .status == "skipped") then "skipped"
                    else "passed" end)
              )
              | .summary = {
                  passed:  ([.test_cases[] | select(.status == "passed")]  | length),
                  failed:  ([.test_cases[] | select(.status == "failed")]  | length),
                  blocked: ([.test_cases[] | select(.status == "blocked")] | length),
                  skipped: ([.test_cases[] | select(.status == "skipped")] | length)
                }
            ' qa_result.json > trajectories/qa_result.json
            echo "valid=true" >> "$GITHUB_OUTPUT"
            jq -r '.summary | "✓ \(.passed) passed, \(.failed) failed, \(.blocked) blocked, \(.skipped) skipped"' trajectories/qa_result.json
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::qa_result.json absent, invalide ou incomplet"
          fi

      - name: Envoyer le rapport au run Supabase
        if: always()
        env:
          REPORT_URL: ${{ inputs.report_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          AI_MODEL: ${{ steps.qa_agent.outputs.model || steps.model.outputs.name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          : "${REPORT_URL:?report_url requis}"
          : "${RUN_TOKEN:?run_token requis}"
          : "${QA_RUN_ID:?qa_run_id requis}"

          if [ ! -s trajectories/qa_result.json ]; then
            jq -n --arg model "$AI_MODEL" --arg run_url "$GH_RUN_URL" \
              --arg run_id "$QA_RUN_ID" \
              --argjson gh_run_id "$GH_RUN_ID" --argjson gh_run_attempt "$GH_RUN_ATTEMPT" \
              '{run_id: $run_id, status: "error", model: $model, executor: "antigravity",
                github_run_id: $gh_run_id, github_run_attempt: $gh_run_attempt,
                github_run_url: $run_url,
                error_message: "Rapport QA absent ou invalide",
                cases: [], side_effects: []}' > report_payload.json
          else
            jq -n --slurpfile r trajectories/qa_result.json \
              --arg model "$AI_MODEL" --arg run_url "$GH_RUN_URL" \
              --arg run_id "$QA_RUN_ID" \
              --argjson gh_run_id "$GH_RUN_ID" --argjson gh_run_attempt "$GH_RUN_ATTEMPT" \
              '($r[0]) as $r |
               {run_id: $run_id,
                status: (if (($r.summary.failed // 0) > 0 or ($r.summary.blocked // 0) > 0) then "failed" else "passed" end),
                model: $model,
                executor: "antigravity",
                github_run_id: $gh_run_id,
                github_run_attempt: $gh_run_attempt,
                github_run_url: $run_url,
                side_effects: ($r.side_effects // []),
                cases: ($r.test_cases | map({
                  code: .id,
                  status: .status,
                  severity: .severity,
                  discovered: .discovered,
                  title: .title,
                  category: .category,
                  suite: null,
                  description: "",
                  steps: (.steps | map({
                    n: .n,
                    status: .status,
                    actual: .actual,
                    precondition: .precondition,
                    action: .action,
                    expected: .expected,
                    evidence: .evidence
                  }))
                }))}' > report_payload.json
          fi

          HTTP=$(curl -sS -o /tmp/report_resp.txt -w "%{http_code}" \
            -X POST "$REPORT_URL" \
            -H "x-run-token: $RUN_TOKEN" \
            -H "Content-Type: application/json" \
            -d @report_payload.json)
          echo "report-run : HTTP $HTTP"
          cat /tmp/report_resp.txt; echo
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]

      - name: Archiver les preuves QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-proofs-${{ inputs.qa_run_id }}
          path: |
            trajectories/
            videos/
            screenshots/
            qa_agent.log
            qa_agent_agy.log
            proxy.log
            qa_result.json
            run_manifest.json
            plan.txt
            report_payload.json
          retention-days: 30
