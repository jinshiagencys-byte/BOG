name: fastbrowse QA — TestDino-like run

# Exécution d'un run sélectionné depuis l'application.
# fastbrowse pilote un Chrome réel avec Jev pour choisir les contrôles et
# un LLM pour planifier/lire la page. Le runner du dépôt garde la propriété
# des assertions : le verdict de fastbrowse ne suffit pas à valider un cas.
#
# Une seule clé est nécessaire : le secret GitHub OPENCODE_API_KEY.
# Elle alimente le LLM et Jev via OpenCode Console.

on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: "ID du run Supabase (test_runs.id)"
        required: true
        type: string
      manifest_url:
        description: "URL de l'Edge Function run-manifest"
        required: true
        type: string
      run_token:
        description: "Jeton éphémère du run (x-run-token)"
        required: true
        type: string
      report_url:
        description: "URL de l'Edge Function report-run"
        required: true
        type: string
      target_url:
        description: "URL cible (facultative, sinon lue dans le manifeste)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fastbrowse-qa-${{ inputs.qa_run_id }}
  cancel-in-progress: false

jobs:
  fastbrowse-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget ca-certificates
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -O /tmp/google-chrome.deb
            sudo apt-get install -y /tmp/google-chrome.deb
          fi
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            google-chrome-stable --version
          fi

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Construire fastbrowse
        shell: bash
        env:
          FASTBROWSE_COMMIT: e46c12a14e5cf5034e69eb7d5a21856eb0f0dc27
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          rm -rf _fastbrowse
          mkdir _fastbrowse
          cd _fastbrowse
          git init -q
          git remote add origin https://github.com/agent-labs-dev/fastbrowse.git
          # Commit épinglé : même version que celle validée en CLI locale.
          git fetch -q --depth 1 origin "$FASTBROWSE_COMMIT"
          git checkout -q FETCH_HEAD
          uv sync --frozen --no-dev
          test -x .venv/bin/fastbrowse
          echo "✓ $(.venv/bin/fastbrowse --version)"

      - name: Installer la sonde Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-node"
          npm install --prefix "$RUNNER_TEMP/qa-node" --no-audit --no-fund playwright-core@1.64.1
          NODE_PATH="$RUNNER_TEMP/qa-node/node_modules" \
            node -e "console.log('✓ playwright-core', require('playwright-core/package.json').version)"

      - name: Récupérer le manifeste du run
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MANIFEST_URL:?manifest_url requis}"
          : "${RUN_TOKEN:?run_token requis}"
          curl -fsS --retry 5 --retry-delay 5 \
            -H "x-run-token: $RUN_TOKEN" "$MANIFEST_URL" -o run_manifest.json
          jq -e '.cases | type == "array" and length > 0' run_manifest.json >/dev/null

      - name: Vérifier la clé OpenCode
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::Secret GitHub OPENCODE_API_KEY absent. Ajoute la clé OpenCode Console dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::$OPENCODE_API_KEY"
          echo "✓ Clé OpenCode lue depuis le secret GitHub"

      - name: Déterminer l'URL cible
        id: target
        env:
          TARGET_URL_INPUT: ${{ inputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL=$(jq -r '.project.url // empty' run_manifest.json)
          if [ -z "$TARGET_URL" ]; then TARGET_URL="${TARGET_URL_INPUT:-}"; fi
          if [ -z "$TARGET_URL" ]; then
            echo "::error::URL cible absente du manifeste et des inputs"
            exit 1
          fi
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "🎯 Cible : $TARGET_URL"
          echo "🧪 Cas : $(jq '.cases | length' run_manifest.json)"

      - name: Exécuter les cas avec fastbrowse
        id: qa
        env:
          FASTBROWSE_CLI: ${{ github.workspace }}/_fastbrowse/.venv/bin/fastbrowse
          FASTBROWSE_DIR: ${{ github.workspace }}/_fastbrowse
          NODE_PATH: ${{ runner.temp }}/qa-node/node_modules
          RUN_MANIFEST: ${{ github.workspace }}/run_manifest.json
          QA_OUTPUT: ${{ github.workspace }}/qa_result.json
          QA_CACHE_DIR: ${{ github.workspace }}/.qa-cache
          TARGET_URL: ${{ steps.target.outputs.url }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          REPORT_URL: ${{ inputs.report_url }}
          RUN_TOKEN: ${{ inputs.run_token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FASTBROWSE_LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FASTBROWSE_LLM_BASE_URL: https://opencode.ai/inference/openai/v1
          FASTBROWSE_LLM_MODEL: deepseek-v4.1-flash
          FASTBROWSE_JEV_SOURCE: typesafe
          FASTBROWSE_JEV_BASE_URL: https://opencode.ai/inference/systemone
          FASTBROWSE_JEV_MODEL: jev-1.13
          FASTBROWSE_CHROME: /usr/bin/google-chrome
          FASTBROWSE_CASE_TIMEOUT_MS: "120000"
          FASTBROWSE_DELAY_MS: "2000"
          FASTBROWSE_RETRIES: "1"
          FASTBROWSE_RETRY_DELAY_MS: "15000"
          FASTBROWSE_MAX_STEPS: "25"
          FASTBROWSE_MAX_DOLLARS: "0.10"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          node .github/qa/fastbrowse-runner.mjs
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::Le runner fastbrowse s'est terminé avec le code $CODE"
          fi

      - name: Archiver les preuves QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastbrowse-qa-${{ inputs.qa_run_id }}
          path: |
            qa_result.json
            run_manifest.json
            .qa-cache/
          if-no-files-found: warn
          retention-days: 30
